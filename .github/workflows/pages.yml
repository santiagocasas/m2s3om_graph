name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Export crosswalk data
        run: |
          python -m pip install 'PyYAML>=6'
          python scripts/export_crosswalk_json.py
      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Include graph visualization data
        run: |
          mkdir -p web/dist/data/graph
          cp exports/graph/crosswalk_graph.json web/dist/data/graph/crosswalk_graph.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
