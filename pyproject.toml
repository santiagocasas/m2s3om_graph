[project]
name = "m2s3om_graph"
version = "0.1.0"
description = "Metadata crosswalk mapping toolkit with SurrealDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32.0",
  "pypdf>=5.4.0",
  "markitdown[all]>=0.1.0",
  "pydantic>=2.11.0",
  "surrealdb>=1.0.4",
  "pyyaml>=6.0.2",
  "streamlit>=1.43.0",
  "matplotlib>=3.10.8",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx2",
]

[project.scripts]
m2s3om_graph = "m2s3om_graph.cli.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.0",
  "basedpyright>=1.28.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m2s3om_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Couldn't find ffmpeg or avconv - defaulting to ffmpeg, but may not work:RuntimeWarning:pydub.utils",
]
