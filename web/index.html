<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M²S³OM-graph · Crosswalk Explorer</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <header>
    <h1>M²S³OM-graph</h1>
    <p>Browse extracted metadata crosswalks. Runs entirely in your browser via an embedded SurrealDB instance, no server, no API calls.</p>
  </header>

  <main>
    <section id="controls">
      <label for="crosswalk-select">Crosswalk</label>
      <select id="crosswalk-select"></select>
    </section>

    <p id="status">Starting...</p>

    <section id="rules-table-container">
      <table id="rules-table">
        <thead>
          <tr>
            <th>Source field</th>
            <th>Target field</th>
            <th>Type</th>
            <th>Confidence</th>
            <th>Evidence</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
