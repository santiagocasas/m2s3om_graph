# Graph visualization styling for scripts/convert_to_human_graph.py.
# Keep HMC palette values here so developers can tune colors and grouping
# without editing Python code.

palette:
  hmc_dark_blue: "#002864"
  hmc_light_blue: "#14c8ff"
  hmc_ast: "#50c8aa"
  hmc_earth_environment: "#326468"
  hmc_energy: "#ffd228"
  hmc_health: "#D23264"
  hmc_information: "#a0235a"
  hmc_matter: "#f0781e"
  fair_data_commons: "#8cd600"
  projects: "#5e3b99"
  mint_highlight: "#05e5ba"
  blue_highlight: "#cdeefb"

topics:
  FAIR data commons:
    color: fair_data_commons
    x: 0
    y: 0
  Information:
    color: hmc_information
    x: -250
    y: -80
  Health:
    color: hmc_health
    x: 260
    y: -80
  Earth and Environment:
    color: hmc_earth_environment
    x: 230
    y: 170
  Matter and Heritage:
    color: hmc_matter
    x: -240
    y: 170
  Aeronautics Space Transport:
    color: hmc_ast
    x: 0
    y: -260
  Projects and Registries:
    color: projects
    x: 0
    y: 270

